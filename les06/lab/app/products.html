            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #eeeeee;
        }

</head>

    <table>
        <tr>

<tr><td>Cat food</td><td>350.5</td><td>10</td></tr><tr><td>Dog toy</td><td>150.0</td><td>20</td></tr><tr><td>Fish food</td><td>99.9</td><td>15</td></tr>    </table>
