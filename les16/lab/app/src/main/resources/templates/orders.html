<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заказы</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            background: #f8f9fa;
        }

        h1 {
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            margin-bottom: 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .actions {
            white-space: nowrap;
        }

        .edit {
            color: #2563eb;
            margin-right: 10px;
        }

        .delete {
            display: inline;
        }
    </style>
</head>

<body>

<h1>Список заказов</h1>

<a class="button" th:href="@{/orders/new}">
    Создать заказ
</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Покупатель</th>
        <th>Дата</th>
        <th>Статус</th>
        <th>Сумма</th>
        <th>Адрес доставки</th>
        <th>Действия</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="order : ${orders}">
        <td th:text="${order.orderId}"></td>

        <td th:text="${order.customer.name}"></td>

        <td th:text="${order.orderDate}"></td>

        <td th:text="${order.status}"></td>

        <td th:text="${order.totalPrice}"></td>

        <td th:text="${order.shippingAddress}"></td>

        <td>
            <a th:href="@{/orders/{id}/edit(id=${order.orderId})}">
                Изменить
            </a>

            <form th:action="@{/orders/{id}/delete(id=${order.orderId})}"
                  method="post"
                  style="display:inline">

                <button type="submit">
                    Удалить
                </button>

            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
